# 키워드 필터 (지시서 3-2 + 0단계 보고 후 합의한 정밀화)
#
# 통과 규칙 (scripts/common.py Keywords.match)
#   1. 제목에서 mask 구절을 지운 뒤 판정한다.
#   2. exclude / exclude_added 가 제목에 있으면 탈락.
#   3. strong 이 제목에 있으면 통과.
#   4. weak 가 제목에 있고 context 단어도 제목에 있으면 통과.
#   5. strong 이 요약(description)에만 있고 제목에 context 단어가 있으면 통과.
#
# 지시서 원안(v1)은 include(= strong + weak) 14개와 exclude 9개를 제목에서 단순 매칭하는 방식이었다.
# 보고서 비교용으로 v1 판정도 함께 계산하므로 아래 원안 목록은 지우지 않는다.

# 지시서 원안 포함 키워드 중 단독으로 지원금·제도 소식을 가리키는 것
strong:
  - 지원금
  - 보조금
  - 바우처
  - 환급
  - 수당
  - 장려금
  - 감면
  - 신청 접수
  - 신청 기간

# 원안 포함 키워드 중 금리·가격·기관명 등에도 흔히 쓰이는 것 → 맥락어가 함께 있어야 통과
weak:
  - 지급
  - 인상
  - 인하
  - 개편
  - 시행

# weak 의 제도 맥락어 (제목에 하나 이상)
context:
  - 요금
  - 보험료
  - 연금
  - 세금
  - 세제
  - 세율
  - 세액
  - 유류세
  - 소득세
  - 법인세
  - 종부세
  - 재산세
  - 취득세
  - 상속세
  - 증여세
  - 부가세
  - 공제
  - 급여
  - 수수료
  - 지원
  - 혜택
  - 신청
  - 대상
  - 한도
  - 부담금
  - 무상
  - 할인
  - 기본소득
  - 쿠폰
  - 소상공인
  - 저소득
  - 취약계층
  - 기초수급
  - 청년
  - 어르신
  - 노인
  - 아동
  - 출산
  - 육아
  - 생계비

# 판정 전에 제목에서 지우는 구절 (오탐 사례)
mask:
  - 인하대
  - 인하공전
  - 지급 및 시장인프라
  - 지급결제
  - 미지급

# 지시서 원안 제외 키워드
exclude:
  - 주가
  - 증시
  - 수사
  - 구속
  - 검찰
  - 선거
  - 경기 결과
  - 사망
  - 사고

# 0단계 보고 후 추가한 제외 키워드 (금리·환율·시장 기사)
exclude_added:
  - 금리
  - 환율
  - 코스피
  - 코스닥
  - 나스닥
  - 비트코인
  - 가상자산
  - 연준
