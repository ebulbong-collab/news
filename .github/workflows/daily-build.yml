name: daily-build

# 마감 상태(신청 마감 배지·정렬)는 빌드 시점의 날짜로 다시 계산한다(지시서 §4). 글이 올라오지 않는 날에도
# 날짜가 바뀌면 사이트를 다시 빌드해야 하므로, 매일 자정 직후 Cloudflare Pages 의 Deploy Hook 을 호출한다.
# Cloudflare 프로젝트 → Settings → Builds → Deploy hooks 에서 만든 URL 을 Secret CF_PAGES_DEPLOY_HOOK 으로 등록한다.
# 등록하지 않았으면 건너뛴다(실패로 처리하지 않는다).
on:
  schedule:
    - cron: "10 15 * * *"   # KST 00:10
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::CF_PAGES_DEPLOY_HOOK 이 설정되지 않아 건너뜀"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "재빌드 요청 완료"
