name: tests

# 코드·템플릿·테스트가 바뀌었을 때 오프라인 테스트와 사이트 빌드를 확인한다. API·외부 네트워크를 쓰지 않는다.
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "templates/**", "static/**", "config.yaml", "keywords.yaml", "requirements*.txt"]
  pull_request:
    paths: ["scripts/**", "tests/**", "templates/**", "static/**", "config.yaml", "keywords.yaml", "requirements*.txt", "content/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Tests
        run: |
          python tests/test_keywords.py
          python tests/test_stage2.py
          python tests/test_build.py
          python tests/test_open_pr.py
      - name: Site build
        run: python scripts/build.py --out /tmp/dist
