# 사이트 전역 설정. 사이트명·도메인은 가칭이므로 확정되면 이 파일에서만 바꾼다.
site:
  name: "지원금소식"            # 가칭
  domain: "jiwon.trendzins.com"  # 가칭
  url: "https://jiwon.trendzins.com"

http:
  # 본문 가져오기(1단계 이후)에서 쓰는 운영용 UA. 사이트 주소를 밝힌다(지시서 2-4).
  user_agent: "SiteBot/0.1 (+https://jiwon.trendzins.com)"
  # 0단계 피드 검증용 UA. 사이트가 아직 공개 전(가칭)이라 주소를 싣지 않는다.
  user_agent_check: "feed-check/0.1 (RSS validation)"
  # RSS 수집용 UA. 도메인이 확정되기 전까지 주소 없이 쓴다. 확정 후 user_agent 와 같게 맞출지 결정.
  # ('collector' 가 들어간 UA 는 한겨레 서버가 403 으로 막아 'reader' 로 쓴다)
  user_agent_feed: "feed-reader/0.1 (RSS reader)"
  # robots.txt 판정 시 매칭할 봇 토큰(로컬 판정용, 전송되지 않음)
  bot_token: "SiteBot"
  min_interval_sec: 1.0          # 같은 사이트에 1초에 1회 이하
  timeout_sec: 15

models:
  cluster_extract: "claude-haiku-5-5"   # 구현 시 Anthropic 문서에서 현재 모델명 재확인
  write: "claude-sonnet-5-5"

limits:
  max_drafts_per_day: 10
  max_articles_per_cluster: 5
  max_body_chars: 4000
  similarity_threshold: 0.10     # 5어절 겹침 비율 상한(운영하며 조정)
  min_post_chars: 600

collect:
  window_hours: 72               # 이보다 오래된 기사는 수집하지 않는다 (주제 묶기 대상 기간)
  candidates_retention_hours: 96 # 후보 기사 보관 기간 (72시간 대기 + 여유)
  seen_retention_days: 30        # seen.json 유지 기간
  min_ok_feeds: 1                # 정상 수집된 피드가 이보다 적으면 실패 종료

cluster:
  model_effort: "medium"         # Haiku 5.5 기본값. 필요시 low 로 낮춘다
  max_titles: 300                # 한 번에 묶을 제목 수 상한
  max_tokens: 16000
  retry_count: 3                 # 429 등 오류 재시도 횟수 (지시서 6-3)
  retry_wait_sec: 30
  min_publishers: 2              # 이 수 이상의 서로 다른 언론사가 있어야 글 후보

feed_check:
  stale_days: 7                  # 이보다 오래 멈춘 피드는 제외
  window_days: 7                 # 키워드 통과 건수 집계 기간
  min_healthy_feeds: 8
  min_healthy_publishers: 5
  min_keyword_per_day: 20
  categories: ["economy", "society", "_all_"]
