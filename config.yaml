# 사이트 전역 설정. 사이트명은 가칭, 도메인은 미확정(placeholder)이다. 확정되면 이 파일에서만 바꾼다.
site:
  name: "지원금소식"            # 가칭
  domain: "example.invalid"     # 미확정 placeholder. 확정 후 실제 도메인으로 교체
  url: "https://example.invalid"
  contact_email: ""             # 정정 요청 연락처. 공개 전에 반드시 채운다(/about/ 에 표시)
  tagline: "여러 기사에서 사실만 모아 대상·금액·기간으로 정리합니다"

http:
  # 기사 본문 가져오기용 UA. 사이트 주소를 밝힌다(지시서 2-4). {site_url} 은 site.url 로 채운다.
  # site.url 이 아직 placeholder(.invalid)이면 연락처 없는 UA 로 대신한다(common.body_user_agent).
  user_agent: "article-reader/0.1 (+{site_url})"
  # 0단계 피드 검증용 UA. 사이트가 아직 공개 전(가칭)이라 주소를 싣지 않는다.
  user_agent_check: "feed-check/0.1 (RSS validation)"
  # RSS 수집용 UA. 도메인이 확정되기 전까지 주소 없이 쓴다. 확정 후 user_agent 와 같게 맞출지 결정.
  # ('collector' 가 들어간 UA 는 한겨레 서버가 403 으로 막아 'reader' 로 쓴다)
  user_agent_feed: "feed-reader/0.1 (RSS reader)"
  # robots.txt 판정 시 매칭할 봇 토큰(로컬 판정용, 전송되지 않음)
  bot_token: "article-reader"
  min_interval_sec: 1.0          # 같은 사이트에 1초에 1회 이하
  timeout_sec: 15

models:
  cluster_extract: "claude-haiku-5-5"   # 구현 시 Anthropic 문서에서 현재 모델명 재확인
  write: "claude-sonnet-5-5"

# 비용 추정용 단가(USD / 100만 토큰, [입력, 출력]). Anthropic 공개 단가 — 바뀌면 여기서 고친다.
prices_usd_per_mtok:
  claude-haiku-5-5: [0.10, 0.50]
  claude-sonnet-5-5: [2.00, 10.00]

limits:
  max_drafts_per_day: 10
  max_articles_per_cluster: 5
  max_body_chars: 4000
  similarity_threshold: 0.10     # 5어절 겹침 비율 상한(운영하며 조정)
  min_post_chars: 600

build:
  soon_days: 7                   # 마감까지 이 일수 이하면 '마감 임박'
  thin_list_min: 3               # 지역·분야 페이지는 글이 이 수 미만이면 noindex + 사이트맵 제외 (§4)
  related_max: 3                 # 글 하단 관련 글 수 (§5)
  sitemap_chunk: 5000            # 사이트맵 1개당 최대 URL

ads:                             # 광고 코드는 글 30편·가이드 10편이 쌓인 뒤에 켠다 (§7)
  enabled: false
  adsense_client: ""             # 예: ca-pub-0000000000000000
  slots: {mid: "", bottom: "", list: ""}

collect:
  window_hours: 72               # 이보다 오래된 기사는 수집하지 않는다 (주제 묶기 대상 기간)
  candidates_retention_hours: 96 # 후보 기사 보관 기간 (72시간 대기 + 여유)
  seen_retention_days: 30        # seen.json 유지 기간
  min_ok_feeds: 1                # 정상 수집된 피드가 이보다 적으면 실패 종료

cluster:
  model_effort: "medium"         # Haiku 5.5 기본값. 필요시 low 로 낮춘다
  max_titles: 300                # 한 번에 묶을 제목 수 상한
  max_tokens: 16000
  min_publishers: 2              # 이 수 이상의 서로 다른 언론사가 있어야 글 후보

api:
  retry_count: 3                 # 429 등 오류 재시도 횟수 (지시서 6-3)
  retry_wait_sec: 30

draft:
  extract_effort: "low"          # 사실 추출(Haiku 5.5): 구조화 추출이라 낮게
  write_effort: "medium"         # 글 작성(Sonnet 5.5)
  write_fallbacks: true          # Sonnet 5.5 거절 시 서버측 폴백(beta). 스킬 기본값
  extract_max_tokens: 8000
  write_max_tokens: 16000
  body_min_chars: 200            # 본문으로 인정하는 최소 글자 수. 미만이면 로그인·유료·차단으로 보고 RSS 대체
  post_chars_target: [800, 1500] # 글 본문 목표 분량(공백 포함). 벗어나면 재작성 요청
  post_chars_min: 600            # 미만이면 발행 대상에서 제외 (지시서 §4)
  max_rewrite: 2                 # 분량 이탈·유사도 초과 시 재작성 최대 횟수 (지시서는 유사도 1회, 분량 포함 합산)
  thin_missing_limit: 2          # 대상·금액·기간 중 기사에 없는 항목이 이 수 이상이면 초안 안 만듦 (§4)

feed_check:
  stale_days: 7                  # 이보다 오래 멈춘 피드는 제외
  window_days: 7                 # 키워드 통과 건수 집계 기간
  min_healthy_feeds: 8
  min_healthy_publishers: 5
  min_keyword_per_day: 20
  categories: ["economy", "society", "_all_"]
